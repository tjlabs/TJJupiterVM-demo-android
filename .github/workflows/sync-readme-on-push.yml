name: Sync README on Push

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run syncReadmeVersion
        run: ./gradlew syncReadmeVersion

      - name: Commit if README changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already in sync"
            exit 0
          fi
          git commit -m "chore: sync README with gradle.properties version"
          git push origin HEAD:${{ github.ref_name }}
