name: Verify VM SDK Auth, Init & Mock

on:
  repository_dispatch:
    types: [sdk-released]
  workflow_dispatch:
    inputs:
      version:
        description: "Target TJJupiterVM SDK version (e.g. 1.0.9)"
        required: true
        type: string
      sector_id:
        description: "Fallback sector_id used when a region has no entry in sector_ids"
        required: false
        type: string
        default: "20"
      sector_ids:
        description: 'Per-region sector_id JSON map (e.g. {"KOREA":"20","SAUDI":"112"}). Overrides sector_id per region.'
        required: false
        type: string
        default: '{"KOREA":"20","SAUDI":"112"}'
      region:
        description: "Target region to verify"
        required: false
        type: choice
        default: "ALL"
        options:
          - KOREA
          - SAUDI
          - ALL

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: verify-vm-sdk-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      sector_ids: ${{ steps.set.outputs.sector_ids }}
      region_matrix: ${{ steps.set.outputs.region_matrix }}
      region_label: ${{ steps.set.outputs.region_label }}
    steps:
      - name: Resolve inputs
        id: set
        shell: bash
        # GitHub Actions expression 결과를 env 로 넘겨야 JSON 내부의 큰따옴표가 bash 파싱에 깨지지 않는다.
        env:
          VERSION_IN: ${{ github.event.client_payload.version || inputs.version }}
          SECTOR_ID_FALLBACK_IN: ${{ github.event.client_payload.sector_id || inputs.sector_id || '20' }}
          SECTOR_IDS_JSON_IN: ${{ github.event.client_payload.sector_ids || inputs.sector_ids || '{"KOREA":"20","SAUDI":"112"}' }}
          REGION_IN: ${{ github.event.client_payload.region || inputs.region || 'ALL' }}
        run: |
          VERSION="$VERSION_IN"
          SECTOR_ID_FALLBACK="$SECTOR_ID_FALLBACK_IN"
          SECTOR_IDS_JSON="$SECTOR_IDS_JSON_IN"
          REGION_RAW="$REGION_IN"
          REGION="$(echo "$REGION_RAW" | tr '[:lower:]' '[:upper:]')"

          if [[ -z "$VERSION" ]]; then
            echo "::error::version is required"
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: $VERSION"
            exit 1
          fi

          # region 별 sector_id 를 매트릭스에 함께 실어 각 job 이 자기 region 의 sector 로 initialize.
          REGION_MATRIX=$(python3 - <<PY
          import json, sys
          region = "$REGION"
          fallback_sector = "$SECTOR_ID_FALLBACK"
          try:
              sector_map = json.loads(r'''$SECTOR_IDS_JSON''')
              if not isinstance(sector_map, dict):
                  raise ValueError("sector_ids must be a JSON object")
          except Exception as e:
              raise SystemExit(f"::error::Invalid sector_ids JSON: {e}")
          if region == "ALL":
              targets = ["KOREA", "SAUDI"]
          elif region in ("KOREA", "SAUDI"):
              targets = [region]
          else:
              raise SystemExit(f"::error::Invalid region: {region}")
          include = [
              {"region": r, "sector_id": str(sector_map.get(r, fallback_sector))}
              for r in targets
          ]
          print(json.dumps({"include": include}))
          PY
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sector_ids=$SECTOR_IDS_JSON" >> "$GITHUB_OUTPUT"
          echo "region_matrix=$REGION_MATRIX" >> "$GITHUB_OUTPUT"
          echo "region_label=$REGION" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION sector_ids=$SECTOR_IDS_JSON region=$REGION"
          echo "Matrix: $REGION_MATRIX"

  verify:
    needs: resolve-inputs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-inputs.outputs.region_matrix) }}
    name: Verify (${{ matrix.region }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Override JUPITER_VM_SDK_VERSION to release tag
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          sed -i "s/^JUPITER_VM_SDK_VERSION=.*/JUPITER_VM_SDK_VERSION=${VERSION}/" gradle.properties
          grep '^JUPITER_VM_SDK_VERSION=' gradle.properties

      - name: Resolve region secrets
        id: resolve-secrets
        shell: bash
        env:
          AUTH_ACCESS_KEY_KOREA: ${{ secrets.AUTH_ACCESS_KEY_KOREA }}
          AUTH_SECRET_ACCESS_KEY_KOREA: ${{ secrets.AUTH_SECRET_ACCESS_KEY_KOREA }}
          AUTH_ACCESS_KEY_SAUDI: ${{ secrets.AUTH_ACCESS_KEY_SAUDI }}
          AUTH_SECRET_ACCESS_KEY_SAUDI: ${{ secrets.AUTH_SECRET_ACCESS_KEY_SAUDI }}
        run: |
          REGION="${{ matrix.region }}"
          ACCESS_VAR="AUTH_ACCESS_KEY_${REGION}"
          SECRET_VAR="AUTH_SECRET_ACCESS_KEY_${REGION}"
          ACCESS_VALUE="${!ACCESS_VAR:-}"
          SECRET_VALUE="${!SECRET_VAR:-}"

          if [[ -z "$ACCESS_VALUE" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=Skipping ${REGION} verification because ${ACCESS_VAR} is not configured" >> "$GITHUB_OUTPUT"
            echo "Skipping ${REGION} verification because ${ACCESS_VAR} is not configured"
            exit 0
          fi

          if [[ -z "$SECRET_VALUE" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "reason=Skipping ${REGION} verification because ${SECRET_VAR} is not configured" >> "$GITHUB_OUTPUT"
            echo "Skipping ${REGION} verification because ${SECRET_VAR} is not configured"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_AUTH_ACCESS_KEY=$ACCESS_VALUE" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_AUTH_SECRET_ACCESS_KEY=$SECRET_VALUE" >> "$GITHUB_ENV"
          echo "Using region-specific secrets: ${ACCESS_VAR}, ${SECRET_VAR}"

      - name: Skip verification
        if: steps.resolve-secrets.outputs.configured != 'true'
        shell: bash
        run: |
          echo "${{ steps.resolve-secrets.outputs.reason }}"

      - name: Run auth/init and mock androidTest on emulator
        if: steps.resolve-secrets.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tjlabs.tjjupitervm_demo_android.AuthInitTest
            -Pandroid.testInstrumentationRunnerArguments.sectorId=${{ matrix.sector_id }}
            -Pandroid.testInstrumentationRunnerArguments.userId=ci_vm_verify_user_${{ matrix.region }}
            --stacktrace
            &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tjlabs.tjjupitervm_demo_android.MockModeTest
            -Pandroid.testInstrumentationRunnerArguments.sectorId=${{ matrix.sector_id }}
            -Pandroid.testInstrumentationRunnerArguments.userId=ci_vm_verify_user_${{ matrix.region }}
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report-${{ needs.resolve-inputs.outputs.version }}-${{ matrix.region }}-sector${{ matrix.sector_id }}
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: ignore

  notify:
    needs: [resolve-inputs, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (Success)
        if: ${{ needs.verify.result == 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL is not set. Skip Slack notification."
            exit 0
          fi
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          SECTOR_IDS="${{ needs.resolve-inputs.outputs.sector_ids }}"
          REGION="${{ needs.resolve-inputs.outputs.region_label }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "text": "✅ TJJupiterVM demo Auth/Init/Mock 검증 완료\n- repo: ${{ github.repository }}\n- version: ${VERSION}\n- sector_ids: ${SECTOR_IDS}\n- region: ${REGION}\n- run: ${RUN_URL}"
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Notify Slack (Failure)
        if: ${{ needs.verify.result != 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL is not set. Skip Slack notification."
            exit 0
          fi
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          SECTOR_IDS="${{ needs.resolve-inputs.outputs.sector_ids }}"
          REGION="${{ needs.resolve-inputs.outputs.region_label }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "text": "❌ TJJupiterVM demo Auth/Init/Mock 검증 실패\n- repo: ${{ github.repository }}\n- version: ${VERSION}\n- sector_ids: ${SECTOR_IDS}\n- region: ${REGION}\n- verify=${{ needs.verify.result }}\n- run: ${RUN_URL}"
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
