name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target VM SDK version (e.g. 1.0.10). Creates release/<version> from main."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver
        shell: bash
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: ${{ inputs.version }}"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Branch must not exist
        shell: bash
        run: |
          BRANCH="release/${{ inputs.version }}"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin"
            exit 1
          fi
          git checkout -b "$BRANCH"

      - name: Bump JUPITER_VM_SDK_VERSION
        shell: bash
        run: |
          sed -i "s/^JUPITER_VM_SDK_VERSION=.*/JUPITER_VM_SDK_VERSION=${{ inputs.version }}/" gradle.properties
          grep '^JUPITER_VM_SDK_VERSION=' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Sync README
        run: ./gradlew syncReadmeVersion

      - name: Commit and push
        shell: bash
        run: |
          BRANCH="release/${{ inputs.version }}"
          git add gradle.properties README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump VM SDK version to ${{ inputs.version }}"
          git push -u origin "$BRANCH"

      - name: Open Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="release/${{ inputs.version }}"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "release: ${{ inputs.version }}" \
            --body "Auto-generated by Create Release Branch. Continue work on this branch, then mark ready for review."
